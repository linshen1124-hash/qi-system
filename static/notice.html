<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知 · 门楼胡同物业费</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { background: var(--orange); display: flex; justify-content: center; padding: 40px 20px; }
  .notice { max-width: 700px; width: 100%; }
  .notice-body { padding: 28px 24px; font-size: 15px; line-height: 2; }
  .notice-body p { margin: 0; text-indent: 2em; }
  .notice-body .rate { font-weight: 700; font-size: 18px; color: var(--purple); }
  .notice-foot { text-align: right; padding: 0 24px 24px; font-weight: 600; }
</style>
</head>
<body>
<div class="notice panel">
  <div class="panel-h"><h2>关于收取门楼胡同物业服务费的通知</h2></div>
  <div class="panel-b">
    <div class="notice-body">
      <p>各位居民：</p>
      <p>经后勤管理处核算，门楼胡同物业服务费收费标准为<span class="rate">2.30元/平方米/月</span>（按建筑面积计算）。</p>
      <p>请各位居民于收到本通知后15日内到后勤管理处办公室缴纳，也可联系工作人员上门收取。</p>
      <p>如有疑问请联系后勤管理处。</p>
    </div>
    <div class="notice-foot">
      <div>后勤管理处</div>
      <div>2026年7月28日</div>
    </div>
  </div>
</div>
</body>
</html>

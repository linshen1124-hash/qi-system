<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QI SYSTEM · 后勤管理</title>
<!-- ?v= 是缓存失效开关：_headers 给 js/css 设了 max-age=86400，
     不换 URL 的话 CDN 会继续发旧文件，改完代码务必把版本号 +1 -->
<link rel="stylesheet" href="/style.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="auth-gate" hidden>
  <form class="auth-card" id="auth-form" autocomplete="on">
    <div class="auth-brand"><b>QI SYSTEM</b><small>后勤管理处 · LOGISTICS OPS</small></div>
    <div class="auth-field">
      <label for="auth-email">账号</label>
      <input id="auth-email" type="email" autocomplete="username" required>
    </div>
    <div class="auth-field">
      <label for="auth-pass">密码</label>
      <input id="auth-pass" type="password" autocomplete="current-password" required>
    </div>
    <p class="auth-err" id="auth-err" hidden></p>
    <button class="btn primary" id="auth-submit" type="submit">登录</button>
  </form>
</div>

<div id="app" hidden>
  <aside class="sidebar">
    <div class="brand"><b>QI SYSTEM</b><small>后勤管理处 · LOGISTICS OPS</small></div>
    <nav id="nav"></nav>
    <div class="sidebar-foot" id="sidebar-foot">v0.1 · 内网单机</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h1 id="page-title">工作台</h1>
      <div id="topbar-actions"></div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="modal-root"></div>
<div id="toast"></div>

<script src="/app.js?v=2"></script>
</body>
</html>
